name: Daily Puzzle Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      ep_num:
        description: 'Episode Number (e.g., 9123). Leave blank for auto.'
        required: false
        default: ''
      offset:
        description: 'Days Offset (e.g., -1 for yesterday). Ignored if Episode Number is set.'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper script
        run: |
          python scripts/puzzle.py \
            --ep "${{ inputs.ep_num }}" \
            --offset "${{ inputs.offset || 0 }}" \
            ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add puzzle_big.csv
          git diff-index --quiet HEAD || git commit -m "Automated update: puzzle_big.csv [skip ci]"
          git push
