name: Daily Puzzle Scraper

on:
  schedule:
    # 00:00 UTC corresponds to 4:00 PM PST every day
    # (Use '0 23 * * *' if you want 4:00 PM PDT during Daylight Saving Time)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper script
        run: python scripts/puzzle.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add puzzle_big.csv
          git diff-index --quiet HEAD || git commit -m "Automated update: puzzle_big.csv [skip ci]"
          git push
