name: Scrape Cats Countdown episodes

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-cats-episodes
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Scrape Cats114–Cats177
        run: python scripts/scrape_cats.py

      - name: Commit updated JSON if changed
        run: |
          if [ -z "$(git status --porcelain -- data/cats-episodes.json)" ]; then
            echo "Episode data is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cats-episodes.json
          git commit -m "Update Cats Countdown episode data"
          git push
